<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nAI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="components/sidebar.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon" class="favicon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" class="favicon">
    <link rel="stylesheet" href="node_modules/toastr/build/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- SweetAlert2 CSS (opsiyonel, eğer JS'de import edilmiyorsa) -->
    <link rel="stylesheet" href="node_modules/sweetalert2/dist/sweetalert2.min.css">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar">
        <div id="sidebar-header">
            <button id="new-chat-button"><i class="fas fa-plus"></i> New Chat</button>
            <!-- İsteğe bağlı: Sidebar daraltma/genişletme butonu eklenebilir -->
        </div>
        <ul id="chat-list">
            <!-- Chat items will be loaded here by JS -->
        </ul>
        <!-- İsteğe bağlı: Alt kısma kullanıcı profili veya ayarlar butonu eklenebilir -->
    </div>

    <!-- Mevcut Ana İçerik -->
    <div id="main-content">
        <div id="profile-section">
            <div id="user-info">
                <img id="profile-picture" src="https://images.vexels.com/media/users/3/137047/isolated/lists/5831a17a290077c646a48c4db78a81bb-user-profile-blue-icon.png" alt="Profile Picture">
                nAI User
            </div>
            <div id="action-buttons">
                <!-- Clear Button'un işlevi değişebilir, şimdilik kalsın -->
                <div id="clear-button" class="action-button"><i class="fa-solid fa-eraser"></i></div>
                <div id="toggle-menu-button" class="action-button"><i class="fa-solid fa-ellipsis"></i></div>
            </div>
        </div>

        <div id="menu-window">
             <!-- ... (menu içeriği aynı) ... -->
        </div>

        <div id="model-window" class="model-window">
             <!-- ... (model penceresi aynı) ... -->
        </div>

        <div id="about-screen" class="about-screen">
             <!-- ... (about ekranı aynı) ... -->
        </div>

        <div id="changelog-screen" class="changelog-screen">
            <!-- ... (changelog ekranı aynı) ... -->
        </div>

        <div id="chat-container">
            <div id="chat-header">
                nAI <!-- Model ismi buraya JS ile yazdırılacak -->
            </div>
            <div id="chat-messages">
                 <!-- Mesajlar buraya JS ile eklenecek -->
            </div>
        </div>

         <!-- Input Alanı -->
         <div id="user-input">
             <input type="text" id="input-text" placeholder="Type your message...">
             <button id="send-button">Send</button>
         </div>
    </div> <!-- #main-content sonu -->


    <script type="module" src="/main.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
</body>
</html>
